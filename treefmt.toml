excludes = [
    "LICENSE*",
    "README.md",
    "toolchains/apple/third-party/prelude/**",
]

walk = "jujutsu"

[formatter.fourmolu]
command = "fourmolu"
options = ["-i", "-c"]
includes = ["*.hs"]

[formatter.go]
command = "gofmt"
options = ["-w"]
includes = ["*.go"]

[formatter.oxfmt]
command = "./buck2/bin/buck2"
includes = ["*.css", "*.js", "*.ts"]
options = ["run", "oxfmt", "--"]

[formatter.ruff-format]
command = "ruff"
includes = ["*.py", "*.pyi"]
options = ["format"]

[formatter.rustfmt]
command = "rustfmt"
includes = ["*.rs"]
options = ["--config", "skip_children=true", "--edition", "2024"]

[formatter.starlark_fmt]
command = "./buck2/bin/starlark_fmt"
includes = ["**/BUCK", "**/PACKAGE", "*.bzl"]
options = ["--config", "./starlark_fmt.json", "fmt"]
stdin-options = ["--config", "./starlark_fmt.json", "stdin", "--path", "$path"]

[formatter.swift]
command = "swift"
includes = ["*.swift"]
options = ["format", "-i"]
