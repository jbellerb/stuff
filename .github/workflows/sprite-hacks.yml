name: Push subproject changes to their main repos

on:
  push:
    branches: [trunk]
    paths:
      - copy.bara.sky
      - flypervisor/**
      - sprite-hacks/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    environment: copybara
    steps:
      - name: Setup Copybara
        uses: $/.github/actions/setup-copybara
        with:
          token: ${{ secrets.COPYBARA_TOKEN }}
          config: copy.bara.sky
          signing_key: ${{ secrets.COMMIT_SIGNING_KEY }}

      - name: Publish change
        run: |
          copybara push-flypervisor
          copybara push-sprite-hacks
